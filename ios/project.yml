name: AnimalMatchPop
options:
  bundleIdPrefix: com.pixelvector
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AnimalMatchPop:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AnimalMatchPop
        excludes:
          - "Resources/**"
          - "Info.plist"
    resources:
      - path: AnimalMatchPop/Resources/Assets.xcassets
      - path: AnimalMatchPop/Resources/bgm_forest_theme.wav
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixelvector.animalmatch
        INFOPLIST_FILE: AnimalMatchPop/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
